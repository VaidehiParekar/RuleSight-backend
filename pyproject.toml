[project]
name = "rulesight-backend"
version = "0.1.0"
description = "RuleSight API (scaffold). Not production-ready."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143,<1",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.20,<2",
    "psycopg[binary]>=3.3,<4",
    "uvicorn>=0.54,<1",
    "google-genai>=1.0,<2",
    "langgraph>=0.2,<2",
]

# No [build-system]: this is an application, not an installable package. uv treats it
# as a virtual project, and the `app` package is imported from this directory.

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=2.4,<3",
    "pytest>=9,<10",
    "ruff>=0.17,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"alembic/versions/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "alembic", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a disposable PostgreSQL database with pgvector (set TEST_DATABASE_URL)",
]
