# Local development stack.
#
#   docker compose up -d db              # PostgreSQL 17 + pgvector only (recommended for development)
#   docker compose --profile app up -d   # also builds and runs the backend API container
#   docker compose down                  # stop containers, keep data
#   docker compose down -v               # stop containers AND delete the local database volume
#
# Security: PostgreSQL is published on 127.0.0.1 only and uses non-default placeholder credentials
# from .env. Do not expose this file's database publicly or reuse its credentials in any shared environment.

name: rulesight

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - rulesight-db-data:/var/lib/postgresql/data
      # Runs once, on first initialisation of an empty volume.
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s

  api:
    profiles: ["app"]
    build:
      context: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network the database is reached by service name, not localhost.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 30s

volumes:
  rulesight-db-data:
